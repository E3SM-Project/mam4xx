name: "E3SM EAMxx-MAM4xx REP tests (ghci)"

# Runs the E3SM CIME test REP_D_Ln5.ne4pg2_oQU480.F2010-EAMxx-MAM4xx.<machine>.eamxx-L72 on
# E3SM's self-hosted ghci runners, with this mam4xx commit in place of the mam4xx submodule of
# E3SM: ghci_gnu on the gnu (CPU) runner, as in E3SM's eamxx-v1 workflow
# (E3SM/.github/workflows/eamxx-v1-testing.yml), and ghci_gnu-cuda on the CUDA runner.
#
# - REP runs the case twice and checks that both runs are bit-for-bit identical.
# - As in eamxx-v1, create_test gets "-c -b master": the history files are also compared,
#   bit-for-bit, with the E3SM master baselines on the runner. The BASELINE phase fails if
#   E3SM has not blessed this test there, or if this mam4xx commit changes answers. A manual
#   run can turn the comparison off. This workflow never blesses: the baselines belong to
#   E3SM.
# - PR runs use E3SM-Project/E3SM master. To test a PR against another E3SM branch (e.g. one
#   with matching EAMxx interface changes), run the workflow manually from the Actions tab on
#   the PR's branch, with the e3sm_repo and e3sm_branch inputs.

on:
  # Runs on PRs against main
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, ready_for_review, reopened]
    paths:
      - '.github/workflows/e3sm-eamxx-mam4xx-ghci.yml'
      - 'src/mam4xx/**'
      - 'CMakeLists.txt'
      - 'cmake/**'

  # Manual run, e.g. to test a mam4xx PR against an E3SM branch other than master
  workflow_dispatch:
    inputs:
      e3sm_repo:
        description: 'repo where e3sm should be grabbed'
        required: false
        type: string
        default: E3SM-Project/E3SM
      e3sm_branch:
        description: 'branch to use for e3sm'
        required: false
        type: string
        default: master
      compare:
        description: 'Compare with the E3SM master baselines'
        required: true
        type: boolean
        default: true

concurrency:
  # Two runs are in the same group if they are testing the same git ref
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    # Login shell, so the runner's modules and environment are loaded
    shell: bash -leo pipefail {0}

env:
  # Unique per run, so runs sharing the runner's /tmp do not collide
  TEST_ID: mam4xx-${{ github.run_id }}-${{ github.run_attempt }}
  # As in eamxx-v1: always compare, unless a manual run turns it off
  CT_FLAGS: ${{ (github.event_name != 'workflow_dispatch' || inputs.compare) && '-c -b master' || '' }}

jobs:
  rep-test:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: [self-hosted, e3sm, '${{ matrix.runner }}']
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: gnu, name: REP_D_Ln5.ne4pg2_oQU480.F2010-EAMxx-MAM4xx.ghci_gnu.eamxx-L72}
          # It will be included in a follow-up PR. 
          #- {runner: cuda, name: REP_D_Ln5.ne4pg2_oQU480.F2010-EAMxx-MAM4xx.ghci_gnu-cuda.eamxx-L72}
    name: ${{ matrix.name }}
    env:
      TEST: ${{ matrix.name }}
      # PR runs use E3SM master; a manual run can choose another repo or branch
      E3SM_REPO: ${{ inputs.e3sm_repo || 'E3SM-Project/E3SM' }}
      E3SM_BRANCH: ${{ inputs.e3sm_branch || 'master' }}
    steps:
      - name: Check out E3SM
        uses: actions/checkout@v4
        with:
          repository: ${{ env.E3SM_REPO }}
          ref: ${{ env.E3SM_BRANCH }}
          path: E3SM
          persist-credentials: false
          show-progress: false
          submodules: recursive
      - name: Remove the mam4xx submodule of E3SM
        run: |
          echo "E3SM pins mam4xx at $(git -C E3SM rev-parse HEAD:externals/mam4xx); replacing it with this commit"
          rm -rf E3SM/externals/mam4xx
      - name: Check out this mam4xx commit in its place
        uses: actions/checkout@v4
        with:
          path: E3SM/externals/mam4xx
          persist-credentials: false
          show-progress: false
      - name: Show action trigger
        uses: ./E3SM/externals/mam4xx/.github/actions/show-workflow-trigger
      - name: Print test specs
        run: |
          echo "test      : $TEST"
          echo "test id   : $TEST_ID"
          echo "E3SM      : $E3SM_REPO at $E3SM_BRANCH ($(git -C E3SM rev-parse HEAD))"
          echo "mam4xx    : $(git -C E3SM/externals/mam4xx rev-parse HEAD)"
          echo "flags     : ${CT_FLAGS:-none (no baseline comparison)}"
          if [ "${{ matrix.runner }}" = cuda ]; then
            nvidia-smi --query-gpu=name --format=csv,noheader || echo "nvidia-smi not found"
          fi
      - name: Run test
        id: run-tests
        working-directory: E3SM/cime/scripts
        run: |
          ./create_test "$TEST" $CT_FLAGS --test-id "$TEST_ID" --wait
      # The test directory is /tmp/<test>.<test id>, with "C." before the test id when
      # comparing (-c) and "G." when generating, so the paths below match any of them
      - name: Print TestStatus.log
        if: ${{ always() && steps.run-tests.outcome == 'failure' }}
        run: |
          for f in /tmp/"$TEST".*"$TEST_ID"/TestStatus.log; do
            echo "::group::$f"
            cat "$f"
            echo "::endgroup::"
          done
      - name: Upload log files
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: logs.${{ env.TEST }}
          path: |
            /tmp/${{ env.TEST }}.*${{ env.TEST_ID }}/TestStatus
            /tmp/${{ env.TEST }}.*${{ env.TEST_ID }}/TestStatus.log
            /tmp/${{ env.TEST }}.*${{ env.TEST_ID }}/bld/**/*.bldlog.*
            /tmp/${{ env.TEST }}.*${{ env.TEST_ID }}/run/**/*.log.*
            /tmp/${{ env.TEST }}.*${{ env.TEST_ID }}/run/**/*.cprnc.out
          retention-days: 14
      - name: Upload nc files
        if: ${{ failure() && steps.run-tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: outputs.${{ env.TEST }}
          path: |
            /tmp/${{ env.TEST }}.*${{ env.TEST_ID }}/run/**/*.nc*
          retention-days: 14
      # The runner is shared and keeps /tmp between runs
      - name: Clean up the test directory
        if: ${{ always() }}
        run: |
          rm -rf /tmp/"${TEST:?}".*"${TEST_ID:?}" /tmp/cs.*."${TEST_ID:?}"*
